<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>SmartOffers QA Dashboard</title>
<style>
:root {
    --bg: #08111f;
    --panel: #0f1b31;
    --panel-2: #12213a;
    --text: #e5eefc;
    --muted: #8aa0c6;
    --line: rgba(255,255,255,.08);
    --accent: #60a5fa;
    --good: #22c55e;
    --warn: #f59e0b;
    --bad: #ef4444;
    --chip: #1d2b47;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    background:
        radial-gradient(circle at top left, rgba(96,165,250,.16), transparent 30%),
        radial-gradient(circle at top right, rgba(34,197,94,.10), transparent 26%),
        linear-gradient(180deg, #07101d 0%, #08111f 100%);
    color: var(--text);
    font-family: Consolas, "SFMono-Regular", Menlo, Monaco, monospace;
}

header {
    padding: 24px 28px 12px;
}

h1 {
    margin: 0;
    font-size: 24px;
    letter-spacing: .4px;
}

.subtitle {
    margin-top: 8px;
    color: var(--muted);
    font-size: 13px;
}

.shell {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 16px;
    padding: 16px 24px 24px;
}

.panel {
    background: linear-gradient(180deg, rgba(18,33,58,.96), rgba(12,22,40,.96));
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: 0 20px 50px rgba(0,0,0,.25);
}

.sidebar {
    padding: 18px;
}

.main {
    padding: 18px;
    display: grid;
    gap: 16px;
}

.field {
    display: grid;
    gap: 8px;
    margin-bottom: 14px;
}

label {
    color: var(--muted);
    font-size: 12px;
}

select, input[type="text"] {
    width: 100%;
    background: #0a1426;
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 12px;
    padding: 10px 12px;
    outline: none;
}

select {
    min-height: 160px;
}

button {
    width: 100%;
    border: none;
    border-radius: 12px;
    padding: 12px 14px;
    background: linear-gradient(135deg, #2563eb, #38bdf8);
    color: white;
    font-weight: 700;
    cursor: pointer;
    transition: transform .15s ease, opacity .15s ease;
}

button:hover { transform: translateY(-1px); }

.toggle {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 10px 0 16px;
    color: var(--text);
}

.progress-wrap {
    margin-top: 14px;
    background: #0a1426;
    border-radius: 999px;
    overflow: hidden;
    border: 1px solid var(--line);
}

.progress-bar {
    height: 10px;
    width: 0%;
    background: linear-gradient(90deg, #22c55e, #60a5fa);
    transition: width .2s ease;
}

.summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-top: 14px;
}

.metric {
    background: var(--chip);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px;
}

.metric .k { color: var(--muted); font-size: 11px; }
.metric .v { margin-top: 6px; font-size: 18px; font-weight: 700; }

.stack {
    display: grid;
    gap: 16px;
}

.card {
    background: rgba(8,17,31,.55);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
}

.card h2 {
    margin: 0 0 12px;
    font-size: 15px;
    color: #d8e4fb;
}

.feed {
    max-height: 340px;
    overflow: auto;
    display: grid;
    gap: 6px;
    padding-right: 6px;
}

.logline {
    padding: 8px 10px;
    border-radius: 10px;
    background: rgba(255,255,255,.03);
    border: 1px solid rgba(255,255,255,.04);
    color: #dbe7ff;
}

.logline.step { border-left: 3px solid var(--accent); }
.logline.ok { border-left: 3px solid var(--good); }
.logline.warn { border-left: 3px solid var(--warn); }
.logline.bad { border-left: 3px solid var(--bad); }

.scenarios {
    display: grid;
    gap: 12px;
}

.scenario {
    border: 1px solid var(--line);
    border-radius: 14px;
    background: rgba(255,255,255,.03);
    padding: 14px;
}

.scenario.active { outline: 1px solid rgba(96,165,250,.45); }

.scenario-head {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
}

.pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    border-radius: 999px;
    background: rgba(96,165,250,.12);
    color: #bfdbfe;
    font-size: 11px;
}

.scenario-meta {
    color: var(--muted);
    font-size: 12px;
    margin-top: 8px;
    line-height: 1.5;
}

.steps {
    margin-top: 10px;
    display: grid;
    gap: 6px;
}

.step-item {
    padding: 8px 10px;
    border-radius: 10px;
    background: rgba(255,255,255,.03);
    color: #dbe7ff;
    font-size: 12px;
}

.analysis {
    white-space: pre-wrap;
    line-height: 1.5;
    color: #dbe7ff;
}

.muted { color: var(--muted); }
</style>
</head>
<body>

<header>
    <h1>SmartOffers QA Dashboard</h1>
    <div class="subtitle">Execução em tempo real, por cenário, com análise visível no navegador e salva ao final de cada fluxo.</div>
</header>

<div class="shell">
    <aside class="panel sidebar">
        <div class="field">
            <label for="filtro">Filtrar variantes</label>
            <input type="text" id="filtro" placeholder="padrao, variante, copy..." onkeyup="filtrar()">
        </div>

        <div class="field">
            <label for="tipo">Variantes</label>
            <select id="tipo" size="8">
                <option>padrao</option>
                <option>variante</option>
                <option>copy</option>
            </select>
        </div>

        <label class="toggle">
            <input type="checkbox" id="analisar">
            Mostrar análise ao vivo
        </label>

        <button onclick="executar()">Executar</button>

        <div class="progress-wrap">
            <div id="progress" class="progress-bar"></div>
        </div>

        <div class="summary">
            <div class="metric">
                <div class="k">Status</div>
                <div class="v" id="status">-</div>
            </div>
            <div class="metric">
                <div class="k">Passos</div>
                <div class="v" id="stepsCount">0</div>
            </div>
            <div class="metric">
                <div class="k">Erros</div>
                <div class="v" id="errorCount">0</div>
            </div>
        </div>
    </aside>

    <main class="main">
        <section class="card">
            <h2>Fluxo ao vivo</h2>
            <div id="terminal" class="feed"></div>
        </section>

        <section class="card">
            <h2>Cenários executados</h2>
            <div id="scenarios" class="scenarios"></div>
        </section>

        <section class="card">
            <h2>Análise</h2>
            <div id="analysis" class="analysis muted">Nenhuma análise ainda.</div>
        </section>
    </main>
</div>

<script>
let currentScenario = null
let totalSteps = 0
let totalErrors = 0

function filtrar(){
    const filtro = document.getElementById("filtro").value.toLowerCase()
    const options = document.getElementById("tipo").options

    for(let i = 0; i < options.length; i++){
        options[i].style.display = options[i].text.toLowerCase().includes(filtro) ? "" : "none"
    }
}

function addFeed(text, cls = ""){
    const terminal = document.getElementById("terminal")
    const div = document.createElement("div")
    div.className = `logline ${cls}`.trim()
    div.textContent = text
    terminal.appendChild(div)
    terminal.scrollTop = terminal.scrollHeight
}

function getScenarioId(kind, numero){
    return `${kind}-${numero}`
}

function ensureScenario(kind, numero, msisdn, path){
    const id = getScenarioId(kind, numero)
    let card = document.getElementById(id)

    if(!card){
        const wrapper = document.createElement("div")
        wrapper.className = "scenario active"
        wrapper.id = id
        wrapper.innerHTML = `
            <div class="scenario-head">
                <strong>${kind} #${numero}</strong>
                <span class="pill">${msisdn}</span>
            </div>
            <div class="scenario-meta">
                <div><span class="muted">Pasta:</span> <span class="path"></span></div>
                <div><span class="muted">Status:</span> <span class="state">em execução</span></div>
            </div>
            <div class="steps"></div>
        `
        wrapper.querySelector(".path").textContent = path
        document.getElementById("scenarios").prepend(wrapper)
        card = wrapper
    }

    return card
}

function addScenarioStep(kind, numero, step){
    const id = getScenarioId(kind, numero)
    const card = document.getElementById(id)
    if(!card) return

    const steps = card.querySelector(".steps")
    const line = document.createElement("div")
    line.className = "step-item"
    line.textContent = step
    steps.appendChild(line)
}

function finishScenario(kind, numero, status, analysisText){
    const card = document.getElementById(getScenarioId(kind, numero))
    if(!card) return
    card.classList.remove("active")
    card.querySelector(".state").textContent = status

    if(analysisText){
        const steps = card.querySelector(".steps")
        const line = document.createElement("div")
        line.className = "step-item"
        line.textContent = `Análise: ${analysisText}`
        steps.appendChild(line)
    }
}

function executar(){
    const tipo = document.getElementById("tipo").value
    const analisar = document.getElementById("analisar").checked

    document.getElementById("terminal").innerHTML = ""
    document.getElementById("scenarios").innerHTML = ""
    document.getElementById("analysis").textContent = "Nenhuma análise ainda."
    document.getElementById("analysis").classList.add("muted")
    document.getElementById("status").textContent = "-"
    document.getElementById("stepsCount").textContent = "0"
    document.getElementById("errorCount").textContent = "0"
    document.getElementById("progress").style.width = "0%"

    currentScenario = null
    totalSteps = 0
    totalErrors = 0

    const eventSource = new EventSource(`/executar?tipo=${tipo}&analisar=${analisar}`)

    eventSource.onmessage = function(event){
        const data = event.data

        if(data.startsWith("RUN|START")){
            addFeed(`Iniciando execução: ${tipo}`, "warn")
        }
        else if(data.startsWith("RUN|END")){
            const parts = data.split("|")
            const status = parts[2]
            const steps = parts[3]
            const errors = parts[4]
            document.getElementById("status").textContent = status
            document.getElementById("stepsCount").textContent = steps
            document.getElementById("errorCount").textContent = errors
            document.getElementById("progress").style.width = "100%"
            addFeed(`Execução finalizada: ${status}`, status === "PASS" ? "ok" : "bad")
            eventSource.close()
        }
        else if(data.startsWith("SCENARIO|START")){
            const parts = data.split("|")
            const kind = parts[2]
            const numero = parts[3]
            const msisdn = parts[4]
            const path = parts.slice(5).join("|")
            currentScenario = { kind, numero }
            ensureScenario(kind, numero, msisdn, path)
            addFeed(`Cenário iniciado: ${kind} #${numero} (${msisdn})`, "warn")
        }
        else if(data.startsWith("SCENARIO|END")){
            const parts = data.split("|")
            const kind = parts[2]
            const numero = parts[3]
            addFeed(`Cenário finalizado: ${kind} #${numero}`, "ok")
            finishScenario(kind, numero, "concluído", "")
        }
        else if(data.startsWith("STEP|")){
            const parts = data.split("|")
            const kind = parts[1]
            const numero = parts[2]
            const step = parts.slice(3).join("|")
            totalSteps++
            document.getElementById("stepsCount").textContent = totalSteps
            document.getElementById("progress").style.width = Math.min(totalSteps * 6, 100) + "%"
            addFeed(`${kind} #${numero}: ${step}`, "step")
            addScenarioStep(kind, numero, step)
        }
        else if(data.startsWith("ANALYSIS|")){
            const parts = data.split("|")
            const kind = parts[1]
            const numero = parts[2]
            const analysis = parts.slice(3).join("|")
            document.getElementById("analysis").textContent = analysis
            document.getElementById("analysis").classList.remove("muted")
            addFeed(`Análise ${kind} #${numero}: ${analysis}`, "ok")
            finishScenario(kind, numero, "concluído com análise", analysis)
        }
        else if(data.startsWith("ERROR|")){
            totalErrors++
            document.getElementById("errorCount").textContent = totalErrors
            addFeed(data, "bad")
        }
        else if(data.startsWith("LOG|")){
            addFeed(data.replace(/^LOG\|/, ""))
        }
        else {
            addFeed(data)
        }
    }
}
</script>

</body>
</html>
