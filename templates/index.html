<!DOCTYPE html>
<html>
<head>
<title>SmartOffers QA Dashboard</title>

<style>
body {
    background: #0f172a;
    color: white;
    font-family: monospace;
}

.container {
    display: flex;
}

.left {
    width: 300px;
}

.right {
    flex: 1;
}

#terminal {
    background: black;
    height: 400px;
    overflow-y: auto;
    padding: 10px;
}

.step { color: #38bdf8; }
.ok { color: #22c55e; }
.erro { color: #ef4444; }

.progress-bar {
    height: 10px;
    background: #22c55e;
    width: 0%;
}
</style>

</head>
<body>

<h2>🚀 QA Dashboard</h2>

<div class="container">

<div class="left">

<input type="text" id="filtro" placeholder="Buscar..." onkeyup="filtrar()">

<select id="tipo" size="8">
<option>padrao</option>
<option>variante</option>
<option>copy</option>
</select>

<br><br>

<label>
<input type="checkbox" id="analisar"> Analisar
</label>

<br><br>

<button onclick="executar()">▶ Executar</button>

<div style="background:#334155;margin-top:10px;">
<div id="progress" class="progress-bar"></div>
</div>

<h3>Status</h3>
<div id="status"></div>

</div>

<div class="right">

<h3>📟 Terminal</h3>
<div id="terminal"></div>

</div>

</div>

<script>

function executar(){

    const tipo = document.getElementById("tipo").value
    const analisar = document.getElementById("analisar").checked

    const terminal = document.getElementById("terminal")
    const status = document.getElementById("status")
    const progress = document.getElementById("progress")

    terminal.innerHTML = ""
    status.innerHTML = ""
    progress.style.width = "0%"

    let steps = 0

    const eventSource = new EventSource(`/executar?tipo=${tipo}&analisar=${analisar}`)

    eventSource.onmessage = function(event){

        let data = event.data

        if(data.startsWith("START")){
            terminal.innerHTML += "<div>🚀 Iniciando...</div>"
        }

        else if(data.startsWith("STEP")){
            steps++
            progress.style.width = (steps * 10) + "%"
            terminal.innerHTML += `<div class="step">${data}</div>`
        }

        else if(data.startsWith("ERROR")){
            terminal.innerHTML += `<div class="erro">${data}</div>`
        }

        else if(data.startsWith("LOG")){
            terminal.innerHTML += `<div>${data}</div>`
        }

        else if(data.startsWith("END")){

            let parts = data.split("|")

            let statusExec = parts[1]
            let total = parts[2]
            let erros = parts[3]

            status.innerHTML = `
                <b>Status:</b> ${statusExec} <br>
                <b>Steps:</b> ${total} <br>
                <b>Erros:</b> ${erros}
            `

            progress.style.width = "100%"

            eventSource.close()
        }

        else if(data.startsWith("AI")){
            terminal.innerHTML += `<div class="ok">${data}</div>`
        }

        terminal.scrollTop = terminal.scrollHeight
    }
}

function filtrar(){
    let filtro = document.getElementById("filtro").value.toLowerCase()
    let options = document.getElementById("tipo").options

    for(let i=0;i<options.length;i++){
        options[i].style.display =
            options[i].text.toLowerCase().includes(filtro) ? "" : "none"
    }
}

</script>

</body>
</html>
